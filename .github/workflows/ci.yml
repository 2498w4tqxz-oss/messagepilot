name: Bridge verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx tsx scripts/fixture-demo.ts
# Apple targets are build-only locally. CI never accesses Messages, Apple identities,
# physical phones, or an existing simulator. See docs/VERIFICATION.md.
