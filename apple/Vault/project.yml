# LineVault: secure-input iMessage app for a line. Generate with `xcodegen generate` here.
# Set VAULT_ALLOWED_HOSTS to the line backend's domain before distributing; the default only
# trusts loopback for local testing.
name: LineVault
options:
  bundleIdPrefix: dev.messagepilot.vault
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '0.1'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    SUPPORTS_MACCATALYST: YES
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
    VAULT_ALLOWED_HOSTS: localhost 127.0.0.1
    # The name people see on the bubble and in the app drawer, e.g. DOOR.
    VAULT_DISPLAY_NAME: Line Vault
targets:
  LineVault:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: LineVaultMessages
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.messagepilot.vault
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(VAULT_DISPLAY_NAME)
        TARGETED_DEVICE_FAMILY: '1,2'
  LineVaultMessages:
    type: app-extension.messages
    platform: iOS
    sources: [Messages, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.messagepilot.vault.messages
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: '1,2'
    info:
      path: Messages/Info.plist
      properties:
        CFBundleDisplayName: $(VAULT_DISPLAY_NAME)
        VaultAllowedHosts: $(VAULT_ALLOWED_HOSTS)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).VaultMessagesViewController
  LineVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.messagepilot.vault.tests
        GENERATE_INFOPLIST_FILE: YES
  LineVaultFlow:
    # Simulator acceptance harness: drives Messages through the bubble flow.
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: LineVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.messagepilot.vault.flow
        TEST_TARGET_NAME: LineVault
        SUPPORTS_MACCATALYST: NO
schemes:
  LineVaultFlow:
    build:
      targets:
        LineVault: all
        LineVaultFlow: [test]
    test:
      targets: [LineVaultFlow]
  LineVault:
    build:
      targets:
        LineVault: all
    test:
      targets: [LineVaultTests]
