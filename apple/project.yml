name: MessagePilot
options:
  bundleIdPrefix: dev.messagepilot
  deploymentTarget:
    iOS: '17.0'
    macOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '1.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ''
targets:
  MessagePilot:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: MessagePilotMessages
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.messagepilot.app
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Share this device location with your paired MessagePilot agent when requested.
        INFOPLIST_KEY_NSCameraUsageDescription: Capture AR room scans for your paired MessagePilot agent.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your personal MessagePilot bridge.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.messagepilot]
        keychain-access-groups: ['$(AppIdentifierPrefix)dev.messagepilot.shared']
  MessagePilotMessages:
    type: app-extension.messages
    platform: iOS
    sources: [Messages, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.messagepilot.app.messages
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Messages/Info.plist
      properties:
        CFBundleDisplayName: MessagePilot
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesController
    entitlements:
      path: Messages/Messages.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.messagepilot]
        keychain-access-groups: ['$(AppIdentifierPrefix)dev.messagepilot.shared']
  MessagePilotVM:
    type: application
    platform: macOS
    sources: [VM]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.messagepilot.vm
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
    entitlements:
      path: VM/VM.entitlements
      properties:
        com.apple.security.virtualization: true
  MessagePilotHarness:
    type: bundle.ui-testing
    platform: iOS
    sources: [Harness]
    dependencies:
      - target: MessagePilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.messagepilot.harness
        TEST_TARGET_NAME: MessagePilot
schemes:
  MessagePilot:
    build:
      targets:
        MessagePilot: all
  MessagePilotHarness:
    build:
      targets:
        MessagePilot: all
        MessagePilotHarness: [test]
    test:
      targets: [MessagePilotHarness]
  MessagePilotVM:
    build:
      targets:
        MessagePilotVM: all
